<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TVM Financial Calculator</title>


<style>

/* =========================================================
   ROOT
========================================================= */

:root {

    --primary: #2563eb;
    --primary-dark: #1e3a8a;
    --primary-light: #dbeafe;

    --success: #16a34a;
    --success-light: #f0fdf4;

    --danger: #dc2626;
    --danger-light: #fef2f2;

    --text: #0f172a;
    --muted: #64748b;

    --border: #e2e8f0;

    --white: #ffffff;

    --background: #eef4ff;

}


/* =========================================================
   RESET
========================================================= */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


/* =========================================================
   BODY
========================================================= */

body {

    font-family:
        Inter,
        "Segoe UI",
        Arial,
        sans-serif;

    min-height: 100vh;

    color: var(--text);

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(37,99,235,0.15),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(30,64,175,0.12),
            transparent 28%
        ),

        linear-gradient(
            135deg,
            #eef4ff,
            #f8fbff
        );

}


/* =========================================================
   TOP HEADER
========================================================= */

.top-header {

    padding: 35px 20px 20px;

    text-align: center;

}


.logo-circle {

    width: 58px;
    height: 58px;

    margin: auto auto 14px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 18px;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #172554
        );

    color: white;

    font-size: 26px;

    font-weight: bold;

    box-shadow:
        0 12px 25px rgba(37,99,235,0.25);

}


.top-header h1 {

    font-size: 34px;

    color: #172554;

    margin-bottom: 7px;

}


.top-header p {

    color: var(--muted);

    font-size: 15px;

}


.badge {

    display: inline-block;

    margin-top: 12px;

    padding: 7px 13px;

    background: rgba(37,99,235,0.08);

    border: 1px solid
        rgba(37,99,235,0.15);

    border-radius: 30px;

    color: var(--primary-dark);

    font-size: 12px;

    font-weight: 600;

}


/* =========================================================
   MAIN
========================================================= */

.page {

    width: 94%;

    max-width: 1150px;

    margin: 15px auto 40px;

}


/* =========================================================
   SINGLE APPLICATION CONTAINER
========================================================= */

.app {

    background:
        rgba(255,255,255,0.88);

    backdrop-filter: blur(15px);

    -webkit-backdrop-filter: blur(15px);

    border: 1px solid
        rgba(255,255,255,0.8);

    border-radius: 26px;

    overflow: hidden;

    box-shadow:
        0 25px 70px
        rgba(30,64,175,0.13);

}


/* =========================================================
   APPLICATION TOP
========================================================= */

.app-top {

    padding: 22px 26px;

    border-bottom: 1px solid var(--border);

    display: flex;

    justify-content: space-between;

    align-items: center;

    gap: 15px;

}


.app-title {

    display: flex;

    gap: 12px;

    align-items: center;

}


.app-title-icon {

    width: 43px;
    height: 43px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 12px;

    background:
        linear-gradient(
            135deg,
            #dbeafe,
            #eff6ff
        );

    color: var(--primary);

    font-size: 21px;

}


.app-title h2 {

    font-size: 19px;

    color: #172554;

}


.app-title span {

    display: block;

    margin-top: 2px;

    color: var(--muted);

    font-size: 12px;

}


/* =========================================================
   CALCULATOR NAVIGATION
========================================================= */

.calculator-nav {

    padding: 18px 22px;

    background:
        linear-gradient(
            180deg,
            #f8fbff,
            #f4f8ff
        );

    border-bottom: 1px solid var(--border);

}


.nav-scroll {

    display: flex;

    gap: 10px;

    overflow-x: auto;

    padding-bottom: 2px;

}


.nav-scroll::-webkit-scrollbar {

    height: 4px;

}


.nav-scroll::-webkit-scrollbar-thumb {

    background: #cbd5e1;

    border-radius: 20px;

}


.calc-tab {

    flex: 0 0 auto;

    border: 1px solid #dbe4f0;

    background: white;

    color: #475569;

    padding: 11px 15px;

    border-radius: 13px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 700;

    display: flex;

    align-items: center;

    gap: 7px;

    transition: 0.22s ease;

}


.calc-tab:hover {

    transform: translateY(-2px);

    border-color: #93c5fd;

    box-shadow:
        0 7px 18px rgba(37,99,235,0.10);

}


.calc-tab.active {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1e40af
        );

    color: white;

    border-color: transparent;

    box-shadow:
        0 9px 20px
        rgba(37,99,235,0.25);

}


/* =========================================================
   WORKSPACE
========================================================= */

.workspace {

    display: grid;

    grid-template-columns:
        minmax(0, 0.95fr)
        minmax(0, 1.05fr);

}


/* =========================================================
   LEFT FORM PANEL
========================================================= */

.form-panel {

    padding: 28px;

    border-right: 1px solid var(--border);

}


.form-heading {

    font-size: 25px;

    color: #172554;

    margin-bottom: 7px;

}


.form-description {

    color: var(--muted);

    font-size: 13px;

    margin-bottom: 20px;

}


/* =========================================================
   FORMULA BOX
========================================================= */

.formula-box {

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #f8fbff
        );

    border: 1px solid #dbeafe;

    border-radius: 14px;

    padding: 15px;

    margin-bottom: 21px;

}


.formula-label {

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1px;

    color: var(--primary);

    font-weight: 800;

    margin-bottom: 6px;

}


.formula-text {

    font-size: 15px;

    color: #1e3a8a;

    font-weight: 700;

}


/* =========================================================
   FIELD
========================================================= */

.field {

    margin-bottom: 17px;

}


.field label {

    display: block;

    font-size: 13px;

    font-weight: 700;

    color: #334155;

    margin-bottom: 7px;

}


.input-wrap {

    position: relative;

}


.input-icon {

    position: absolute;

    left: 13px;

    top: 50%;

    transform: translateY(-50%);

    color: #64748b;

    font-size: 15px;

    pointer-events: none;

}


.input-wrap input {

    padding-left: 40px;

}


input,
select {

    width: 100%;

    height: 47px;

    padding: 0 13px;

    border:

        1px solid
        #cbd5e1;

    border-radius: 11px;

    background: white;

    color: var(--text);

    font-size: 14px;

    outline: none;

    transition: 0.2s;

}


input:focus,
select:focus {

    border-color: var(--primary);

    box-shadow:
        0 0 0 4px
        rgba(37,99,235,0.09);

}


/* =========================================================
   UNIT ROW
========================================================= */

.unit-row {

    display: grid;

    grid-template-columns:
        minmax(0, 2fr)
        minmax(115px, 1fr);

    gap: 9px;

}


/* =========================================================
   ACTION BUTTONS
========================================================= */

.action-row {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        120px;

    gap: 10px;

    margin-top: 22px;

}


.primary-btn,
.secondary-btn {

    border: 0;

    height: 48px;

    border-radius: 11px;

    cursor: pointer;

    font-size: 14px;

    font-weight: 800;

    transition: 0.22s;

}


.primary-btn {

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #1e40af
        );

    color: white;

    box-shadow:
        0 9px 20px
        rgba(37,99,235,0.20);

}


.primary-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 13px 26px
        rgba(37,99,235,0.25);

}


.secondary-btn {

    background: #f1f5f9;

    color: #475569;

}


.secondary-btn:hover {

    background: #e2e8f0;

}


/* =========================================================
   SAMPLE BUTTON
========================================================= */

.sample-btn {

    display: inline-flex;

    align-items: center;

    gap: 5px;

    margin-top: 11px;

    background: transparent;

    border: 0;

    color: var(--primary);

    font-weight: 700;

    font-size: 12px;

    cursor: pointer;

}


.sample-btn:hover {

    text-decoration: underline;

}


/* =========================================================
   RIGHT RESULT PANEL
========================================================= */

.result-panel {

    padding: 28px;

    background:
        linear-gradient(
            145deg,
            #fbfdff,
            #f4f8ff
        );

    min-height: 500px;

}


/* =========================================================
   EMPTY RESULT
========================================================= */

.empty-state {

    height: 100%;

    min-height: 440px;

    display: flex;

    align-items: center;

    justify-content: center;

    text-align: center;

    padding: 30px;

}


.empty-icon {

    width: 72px;
    height: 72px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin: auto auto 15px;

    border-radius: 22px;

    background: #dbeafe;

    color: var(--primary);

    font-size: 30px;

}


.empty-state h3 {

    color: #172554;

    font-size: 20px;

    margin-bottom: 6px;

}


.empty-state p {

    color: var(--muted);

    max-width: 300px;

    margin: auto;

    font-size: 13px;

}


/* =========================================================
   RESULT HEADER
========================================================= */

.result-header {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;

}


.result-header h3 {

    font-size: 21px;

    color: #172554;

}


.result-tag {

    background: #dcfce7;

    color: #166534;

    border-radius: 30px;

    padding: 6px 10px;

    font-size: 11px;

    font-weight: 800;

}


/* =========================================================
   PRIMARY RESULT
========================================================= */

.primary-result {

    background:
        linear-gradient(
            135deg,
            #eff6ff,
            #ffffff
        );

    border: 1px solid #dbeafe;

    border-radius: 17px;

    padding: 20px;

    margin-bottom: 14px;

}


.primary-result-label {

    font-size: 12px;

    color: var(--muted);

    margin-bottom: 6px;

}


.primary-result-value {

    font-size: 31px;

    font-weight: 900;

    color: #1e3a8a;

    word-break: break-word;

}


/* =========================================================
   RESULT STAT GRID
========================================================= */

.result-grid {

    display: grid;

    grid-template-columns:
        repeat(2, minmax(0,1fr));

    gap: 10px;

}


.result-card {

    background: white;

    border: 1px solid var(--border);

    border-radius: 13px;

    padding: 14px;

}


.result-card span {

    display: block;

    color: var(--muted);

    font-size: 11px;

    margin-bottom: 5px;

}


.result-card strong {

    color: #172554;

    font-size: 15px;

}


/* =========================================================
   EXPLANATION BOX
========================================================= */

.explanation {

    margin-top: 14px;

    padding: 14px;

    border-radius: 12px;

    background: #f8fafc;

    border: 1px solid var(--border);

    font-size: 12px;

    color: #475569;

}


.explanation strong {

    color: #1e3a8a;

}


/* =========================================================
   ERROR
========================================================= */

.error-box {

    display: none;

    margin-top: 15px;

    padding: 13px;

    border-radius: 11px;

    background: var(--danger-light);

    border-left:
        5px solid
        var(--danger);

    color: #991b1b;

    font-size: 13px;

    font-weight: 600;

}


/* =========================================================
   AMORTIZATION TABLE
========================================================= */

.table-wrapper {

    margin-top: 15px;

    max-height: 390px;

    overflow: auto;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: white;

}


table {

    width: 100%;

    border-collapse: collapse;

    font-size: 12px;

}


th {

    position: sticky;

    top: 0;

    z-index: 2;

    background: #1e3a8a;

    color: white;

    padding: 10px 8px;

    white-space: nowrap;

}


td {

    padding: 8px;

    border-bottom: 1px solid #e2e8f0;

    white-space: nowrap;

    text-align: right;

}


td:first-child {

    text-align: center;

    font-weight: 700;

}


tr:nth-child(even) {

    background: #f8fafc;

}


/* =========================================================
   SCENARIO
========================================================= */

.scenario-row {

    background: white;

    border: 1px solid var(--border);

    padding: 12px;

    border-radius: 12px;

    margin-bottom: 9px;

}


.scenario-top {

    display: flex;

    justify-content: space-between;

    align-items: center;

    margin-bottom: 7px;

}


.scenario-rate {

    font-weight: 900;

    color: #1e3a8a;

}


.scenario-emi {

    font-size: 13px;

    font-weight: 800;

}


.scenario-bar {

    height: 7px;

    border-radius: 20px;

    background: #e2e8f0;

    overflow: hidden;

}


.scenario-fill {

    height: 100%;

    border-radius: 20px;

    background:
        linear-gradient(
            90deg,
            #60a5fa,
            #2563eb
        );

}


.scenario-details {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 8px;

    margin-top: 8px;

}


.scenario-detail {

    font-size: 11px;

    color: var(--muted);

}


.scenario-detail strong {

    display: block;

    color: #334155;

    font-size: 12px;

    margin-top: 2px;

}


/* =========================================================
   FOOTER
========================================================= */

footer {

    text-align: center;

    color: #64748b;

    padding: 20px;

    font-size: 12px;

}


/* =========================================================
   ANIMATION
========================================================= */

.animate-in {

    animation:
        fadeSlide
        0.3s ease;

}


@keyframes fadeSlide {

    from {

        opacity: 0;

        transform:
            translateY(8px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 850px) {

    .workspace {

        grid-template-columns: 1fr;

    }


    .form-panel {

        border-right: 0;

        border-bottom:
            1px solid
            var(--border);

    }

}


@media (max-width: 600px) {

    .top-header h1 {

        font-size: 27px;

    }


    .app {

        border-radius: 18px;

    }


    .app-top {

        padding: 18px;

    }


    .calculator-nav {

        padding: 14px;

    }


    .form-panel,
    .result-panel {

        padding: 20px;

    }


    .result-grid {

        grid-template-columns: 1fr;

    }


    .action-row {

        grid-template-columns: 1fr;

    }


    .unit-row {

        grid-template-columns: 1fr;

    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header class="top-header">

    <div class="logo-circle">
        ₹
    </div>

    <h1>
        Time Value of Money
    </h1>
</header>


<div class="page">


    <!-- =====================================================
         SINGLE APPLICATION
    ====================================================== -->

    <div class="app">


        <!-- APP HEADER -->

        <div class="app-top">

            <div class="app-title">

                <div class="app-title-icon">
                    ◈
                </div>

                <div>

                    <h2>
                        TVM Financial Calculator
                    </h2>

                    <span>
                        Select a calculation to get started
                    </span>

                </div>

            </div>

        </div>


        <!-- =================================================
             CALCULATOR NAV
        ================================================== -->

        <div class="calculator-nav">

            <div class="nav-scroll">


                <button
                    class="calc-tab active"
                    data-type="fv"
                    onclick="selectCalculator('fv')"
                >
                    📈 Future Value
                </button>


                <button
                    class="calc-tab"
                    data-type="pv"
                    onclick="selectCalculator('pv')"
                >
                    💰 Present Value
                </button>


                <button
                    class="calc-tab"
                    data-type="si"
                    onclick="selectCalculator('si')"
                >
                    🧮 Simple Interest
                </button>


                <button
                    class="calc-tab"
                    data-type="ci"
                    onclick="selectCalculator('ci')"
                >
                    📊 Compound Interest
                </button>


                <button
                    class="calc-tab"
                    data-type="emi"
                    onclick="selectCalculator('emi')"
                >
                    🏦 EMI
                </button>


                <button
                    class="calc-tab"
                    data-type="amortization"
                    onclick="selectCalculator('amortization')"
                >
                    📋 Amortization
                </button>


                <button
                    class="calc-tab"
                    data-type="scenario"
                    onclick="selectCalculator('scenario')"
                >
                    🔍 Scenario Analysis
                </button>


            </div>

        </div>


        <!-- =================================================
             WORKSPACE
        ================================================== -->

        <div class="workspace">


            <!-- =================================================
                 FORM
            ================================================== -->

            <div class="form-panel">

                <div id="formArea"></div>

                <div
                    id="errorBox"
                    class="error-box"
                ></div>

            </div>


            <!-- =================================================
                 RESULT
            ================================================== -->

            <div class="result-panel">

                <div id="resultArea">

                    <div class="empty-state">

                        <div>

                            <div class="empty-icon">
                                ◎
                            </div>

                            <h3>
                                Ready to Calculate
                            </h3>
                        </div>

                    </div>

                </div>

            </div>


        </div>

    </div>

</div>


<footer>

    TVM Financial Calculator • Assignment 1

</footer>


<script>

/* =========================================================
   GLOBAL
========================================================= */

let currentCalculator = "fv";


/* =========================================================
   HELPERS
========================================================= */

function formatMoney(value) {

    return "₹" +
        Number(value).toLocaleString(
            "en-IN",
            {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2
            }
        );

}


function getValue(id) {

    const element =
        document.getElementById(id);

    if (!element) {

        return NaN;

    }

    return parseFloat(
        element.value
    );

}


function showError(message) {

    const error =
        document.getElementById(
            "errorBox"
        );

    error.innerHTML =
        "⚠ " + message;

    error.style.display =
        "block";

}


function hideError() {

    document.getElementById(
        "errorBox"
    ).style.display =
        "none";

}


function showResult(html) {

    const result =
        document.getElementById(
            "resultArea"
        );

    result.innerHTML =
        `<div class="animate-in">${html}</div>`;

}


function clearResult() {

    document.getElementById(
        "resultArea"
    ).innerHTML = `

        <div class="empty-state animate-in">

            <div>

                <div class="empty-icon">
                    ◎
                </div>

                <h3>
                    Ready to Calculate
                </h3>
            </div>

        </div>

    `;

}


/* =========================================================
   TIME CONVERSION
========================================================= */


/*
    Used for FV, PV, SI and CI.

    These formulas use time in years.

    Example:
    6 months = 6 / 12 = 0.5 years
*/

function convertToYears(
    value,
    unit
) {

    if (unit === "months") {

        return value / 12;

    }

    return value;

}


/*
    Used for EMI, Amortization and Scenario.

    Example:
    5 years = 60 months.
*/

function convertToMonths(
    value,
    unit
) {

    if (unit === "years") {

        return Math.round(
            value * 12
        );

    }

    return Math.round(value);

}


/* =========================================================
   SELECT CALCULATOR
========================================================= */

function selectCalculator(type) {

    currentCalculator =
        type;

    hideError();

    clearResult();


    document
        .querySelectorAll(
            ".calc-tab"
        )
        .forEach(
            tab => {

                tab.classList.remove(
                    "active"
                );

            }
        );


    const activeTab =
        document.querySelector(
            `.calc-tab[data-type="${type}"]`
        );


    if (activeTab) {

        activeTab.classList.add(
            "active"
        );

    }


    loadForm(type);

}


/* =========================================================
   LOAD DYNAMIC FORM
========================================================= */

function loadForm(type) {


    /* =====================================================
       FUTURE VALUE
    ====================================================== */

    if (type === "fv") {

        document.getElementById(
            "formArea"
        ).innerHTML = `

            <h2 class="form-heading">
                Future Value
            </h2>

            <p class="form-description">
                Find out how much your current
                investment will be worth in the future.
            </p>

            <div class="formula-box">

                <div class="formula-label">
                    Formula
                </div>

                <div class="formula-text">
                    FV = P × (1 + r)<sup>t</sup>
                </div>

            </div>


            <div class="field">

                <label>
                    Principal Amount
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        ₹
                    </span>

                    <input
                        id="fvPrincipal"
                        type="number"
                        placeholder="e.g. 100000"
                        min="0"
                        step="any"
                    >

                </div>

            </div>


            <div class="field">

                <label>
                    Annual Interest Rate (%)
                </label>

                <div class="input-wrap">

                    <span class="input-icon">
                        %
                    </span>

                    <input
                        id="fvRate"
                        type="number"
                        placeholder="e.g. 10"
                        min="0"
                        step="any"
                    >

                </div>

            </div>


            <div class="field">

                <label>
                    Time Period
                </label>

                <div class="unit-row">

                    <input
                        id="fvTime"
                        type="number"
                        placeholder="e.g. 5"
                        min="0"

/* =========================================================
   1. FUTURE VALUE
========================================================= */

function calculateFV() {

    hideError();


    const P =
        getValue("fvPrincipal");

    const rate =
        getValue("fvRate");

    const timeValue =
        getValue("fvTime");

    const unit =
        document.getElementById(
            "fvTimeUnit"
        ).value;


    if (
        !P ||
        P <= 0
    ) {

        showError(
            "Please enter a principal amount greater than zero."
        );

        return;

    }


    if (
        isNaN(rate) ||
        rate < 0
    ) {

        showError(
            "Please enter a valid interest rate."
        );

        return;

    }


    if (
        !timeValue ||
        timeValue <= 0
    ) {

        showError(
            "Please enter a valid time period."
        );

        return;

    }


    const t =
        convertToYears(
            timeValue,
            unit
        );


    const r =
        rate / 100;


    const FV =
        P *
        Math.pow(
            1 + r,
            t
        );


    showResult(`

        <div class="result-header">

            <h3>
                Future Value Result
            </h3>

            <span class="result-tag">
                CALCULATED
            </span>

        </div>


        <div class="primary-result">

            <div class="primary-result-label">
                Future Value
            </div>

            <div class="primary-result-value">
                ${formatMoney(FV)}
            </div>

        </div>


        <div class="result-grid">

            <div class="result-card">

                <span>
                    Principal
                </span>

                <strong>
                    ${formatMoney(P)}
                </strong>

            </div>


            <div class="result-card">

                <span>
                    Interest Rate
                </span>

                <strong>
                    ${rate}%
                </strong>

            </div>


            <div class="result-card">

                <span>
                    Entered Time
                </span>

                <strong>
                    ${timeValue} ${unit}
                </strong>

            </div>


            <div class="result-card">

                <span>
                    Time Used
                </span>

                <strong>
                    ${t.toFixed(4)} years
                </strong>

            </div>

        </div>


        <div class="explanation">

            <strong>
                Logic:
            </strong>

            The annual interest rate is converted
            to decimal form and the selected time
            is used in the Future Value formula.

    `);

}

/* =========================================================
   4. COMPOUND INTEREST
========================================================= */

function calculateCI() {

    hideError();


    const P =
        getValue("ciPrincipal");

    const rate =
        getValue("ciRate");

    const timeValue =
        getValue("ciTime");

    const unit =
        document.getElementById(
            "ciTimeUnit"
        ).value;

    const n =
        getValue("ciFrequency");


    if (
        !P ||
        P <= 0
    ) {

        showError(
            "Please enter a principal amount greater than zero."
        );

        return;

    }


    if (
        isNaN(rate) ||
        rate < 0
    ) {

        showError(
            "Please enter a valid interest rate."
        );

        return;

    }


    if (
        !timeValue ||
        timeValue <= 0
    ) {

        showError(
            "Please enter a valid time period."
        );

        return;

    }


    const t =
        convertToYears(
            timeValue,
            unit
        );


    const r =
        rate / 100;


    const maturity =
        P *
        Math.pow(
            1 + r / n,
            n * t
        );


    const interest =
        maturity - P;


    showResult(`

        <div class="result-header">

            <h3>
                Compound Interest Result
            </h3>

            <span class="result-tag">
                CALCULATED

/* =========================================================
   FREQUENCY NAME
========================================================= */

function getFrequencyName(n) {

    if (n === 1) {

        return "Annually";

    }

    if (n === 2) {

        return "Half-Yearly";

    }

    if (n === 4) {

        return "Quarterly";

    }

    if (n === 12) {

        return "Monthly";

    }

    return n + " times/year";

}


/* =========================================================
   EMI FUNCTION
========================================================= */

function calculateEMIValue(
    P,
    annualRate,
    months
) {

    const monthlyRate =
        annualRate / 12 / 100;


    if (
        monthlyRate === 0
    ) {

        return P / months;

    }


    return (

        P *
        monthlyRate *
        Math.pow(
            1 + monthlyRate,
            months
        )

    )
    /
    (

        Math.pow(
            1 + monthlyRate,
            months
        ) - 1

    );

}


/* =========================================================
   5. EMI
========================================================= */

function calculateEMI() {

    hideError();


    const P =
        getValue("emiLoan");

    const rate =
        getValue("emiRate");

    const tenure =
        getValue("emiTenure");

    const unit =
        document.getElementById(
            "emiTenureUnit"
        ).value;


    if (
        !P ||
        P <= 0
    ) {

        showError(
            "Please enter a loan amount greater than zero."
        );

        return;

    }


    if (
        isNaN(rate) ||
        rate < 0
    ) {

        showError(
            "Please enter a valid interest rate."
        );

        return;

    }


    if (
        !tenure ||
        tenure <= 0
    ) {

        showError(
            "Please enter a valid loan tenure."
        );

        return;

    }


    const months =
        convertToMonths(
            tenure,
            unit
        );


    if (
        months < 1
    ) {

        showError(
            "Loan tenure must be at least one month."
        );

        return;

    }


    const EMI =
        calculateEMIValue(
            P,
            rate,
            months

    const totalPayment =
        EMI * months;


    const totalInterest =
        totalPayment - P;


    showResult(`

        </div>

                Logic:
            </strong>

            monthly rate and the selected tenure is
            converted into the total number of months.

        </div>

    `);

}


/* =========================================================
   6. AMORTIZATION
========================================================= */

function generateAmortization() {

    hideError();


    const P =
        getValue("amLoan");

    const rate =
        getValue("amRate");

    const tenure =
        getValue("amTenure");

    const unit =
        document.getElementById(
            "amTenureUnit"
        ).value;


    if (
        !P ||
        P <= 0
    ) {

        showError(
            "Please enter a loan amount greater than zero."
        );

        return;

    }


    if (
        isNaN(rate) ||
        rate < 0
    ) {

        showError(
            "Please enter a valid interest rate."
        );

        return;

    }


    if (
        !tenure ||
        tenure <= 0
    ) {

        showError(
            "Please enter a valid loan tenure."
        );

        return;

    }


    const months =
        convertToMonths(
            tenure,
            unit
        );


    if (
        months < 1
    ) {

        showError(
            "Loan tenure must be at least one month."
        );

        return;

    }


    const monthlyRate =
        rate / 12 / 100;


    const EMI =
        calculateEMIValue(
            P,
            rate,
            months
        );


    let balance =
        P;


    let totalInterest =
        0;


    let rows = "";


    for (
        let month = 1;
        month <= months;
        month++
    ) {

        const openingBalance =
            balance;


        let interest =
            balance *
            monthlyRate;


        let principal =
            EMI - interest;


        let actualPayment =
            EMI;


        let closingBalance =
            balance - principal;


        /*
            Final month correction.
        */

        if (
            month === months
        ) {

            principal =
                balance;

            actualPayment =
                principal +
                interest;

            closingBalance =
                0;

        }


        totalInterest +=
            interest;


        rows += `

            <tr>

                <td>
                    ${month}
                </td>

                <td>
                    ${formatMoney(
                        openingBalance
                    )}
                </td>

                <td>
                    ${formatMoney(
                        interest
                    )}
                </td>

                <td>
                    ${formatMoney(
                        principal
                    )}
                </td>

                <td>
                    ${formatMoney(
                        actualPayment
                    )}
                </td>

                <td>
                    ${formatMoney(
                        Math.max(
                            0,
                            closingBalance
                        )
                    )}
                </td>

            </tr>

        `;


        balance =
            closingBalance;

    }


    const totalPayment =
        P + totalInterest;


    showResult(`

        <div class="result-header">

            <h3>
                Amortization Schedule
            </h3>

            <span class="result-tag">
                ${months} MONTHS
            </span>

        </div>


        <div class="result-grid">

            <div class="result-card">

                <span>
                    Loan Amount
                </span>

                <strong>
                    ${formatMoney(P)}
                </strong>

            </div>


            <div class="result-card">

                <span>
                    Monthly EMI
                </span>

                <strong>
                    ${formatMoney(EMI)}
                </strong>

            </div>


            <div class="result-card">

                <span>
                    Total Interest
                </span>

                <strong>
                    ${formatMoney(
                        totalInterest
                    )}
                </strong>

            </div>


            <div class="result-card">

                <span>
                    Total Payment
                </span>

                <strong>
                    ${formatMoney(
                        totalPayment
                    )}
                </strong>

            </div>

        </div>


        <div class="table-wrapper">

            <table>

                <thead>

                    <tr>

                        <th>
                            Month
                        </th>

                        <th>
                            Opening Balance
                        </th>

                        <th>
                            Interest
                        </th>

                        <th>
                            Principal Repaid
                        </th>

                        <th>
                            EMI
                        </th>

                        <th>
                            Closing Balance
                        </th>

                    </tr>

                </thead>


                <tbody>

                    ${rows}

                </tbody>

            </table>

        </div>


        <div class="explanation">

            <strong>
                Logic:
            </strong>

            Each month calculates interest on the
            opening balance, subtracts the interest
            from EMI to determine principal repayment,
            and then updates the closing balance.

        </div>

    `);

}


/* =========================================================
   7. SCENARIO ANALYSIS
========================================================= */

function scenarioAnalysis() {

    hideError();


    const P =
        getValue("scLoan");

    const tenure =
        getValue("scTenure");

    const unit =
        document.getElementById(
            "scTenureUnit"
        ).value;


    if (
        !P ||
        P <= 0
    ) {

        showError(
            "Please enter a loan amount greater than zero."
        );

        return;

    }


    if (
        !tenure ||
        tenure <= 0
    ) {

        showError(
            "Please enter a valid loan tenure."
        );

        return;

    }


    const months =
        convertToMonths(
            tenure,
            unit
        );


    if (
        months < 1
    ) {

        showError(
            "Loan tenure must be at least one month."
        );

        return;

    }


    /*
        Required assignment rates.
    */

    const rates =
        [8, 10, 12, 15];


    const scenarios =
        rates.map(
            rate => {

                const EMI =
                    calculateEMIValue(
                        P,
                        rate,
                        months
                    );


                const totalPayment =
                    EMI * months;


                const totalInterest =
                    totalPayment - P;


                return {

                    rate,
                    EMI,
                    totalPayment,
                    totalInterest

                };

            }
        );


    const highestEMI =
        Math.max(
            ...scenarios.map(
                item => item.EMI
            )
        );


    let scenarioHTML = "";


    scenarios.forEach(
        item => {

            const width =
                (
                    item.EMI /
                    highestEMI
                ) * 100;


            scenarioHTML += `

                <div class="scenario-row">

                    <div class="scenario-top">

                        <span class="scenario-rate">
                            ${item.rate}%
                        </span>

                        <span class="scenario-emi">
                            ${formatMoney(
                                item.EMI
                            )} / month
                        </span>

                    </div>


                    <div class="scenario-bar">

                        <div
                            class="scenario-fill"
                            style="width:${width}%"
                        ></div>

                    </div>


                    <div class="scenario-details">

                        <div class="scenario-detail">

                            Total Payment

                            <strong>
                                ${formatMoney(
                                    item.totalPayment
                                )}
                            </strong>

                        </div>


                        <div class="scenario-detail">

                            Total Interest

                            <strong>
                                ${formatMoney(
                                    item.totalInterest
                                )}
                            </strong>

                        </div>

                    </div>

                </div>

            `;

        }
    );


    showResult(`

        <div class="result-header">

            <h3>
                Scenario Analysis
            </h3>

            <span class="result-tag">
                4 RATES
            </span>

        </div>


        <div class="result-grid">

            <div class="result-card">

                <span>
                    Loan Amount
                </span>

                <strong>
                    ${formatMoney(P)}
                </strong>

            </div>


            <div class="result-card">

                <span>
                    Loan Tenure
                </span>

                <strong>
                    ${tenure} ${unit}
                </strong>

            </div>

        </div>


        <div
            style="
                margin-top:15px;
                margin-bottom:8px;
                font-size:12px;
                color:#64748b;
                font-weight:700;
            "
        >
            Interest Rates Compared:
            8%, 10%, 12%, 15%
        </div>


        ${scenarioHTML}


        <div class="explanation">

            <strong>
                Logic:
            </strong>

            The loan amount and tenure remain fixed.
            The application automatically calculates
            EMI, total payment and total interest for
            the four required interest-rate scenarios.

        </div>

    `);

}
